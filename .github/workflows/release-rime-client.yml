# Build and push rime-client to GHCR when a package version tag is pushed.
# Git tag is the source of truth: rime-client-vX.Y.Z → image :vX.Y.Z
name: Release rime-client

on:
  push:
    tags:
      - "rime-client-v*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          tag="${{ github.ref_name }}"
          prefix="rime-client-"
          if [[ "$tag" != ${prefix}* ]]; then
            echo "Tag '$tag' does not start with '$prefix'" >&2
            exit 1
          fi
          semver="${tag#"$prefix"}"
          if [[ ! "$semver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Expected SemVer after prefix, got '$semver' (want vX.Y.Z)" >&2
            exit 1
          fi
          # Strip leading v for the container ENV (v0.1.0 → 0.1.0)
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "version=${semver#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/rime-client" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/rime-client
          file: packages/rime-client/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.semver }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
