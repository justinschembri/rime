server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # rime-client is a static SensorThings client. It does not proxy to, or know
    # about, any particular STA server — the browser talks to whatever endpoint
    # the page is configured with. See js/runtime-config.js and README.md.
    location / {
        try_files $uri $uri/ /index.html;

        # The app ships unversioned filenames (app.js, js/*.js, styles.css), so
        # without this a browser keeps serving a cached copy after a redeploy and
        # the user silently runs old code. "no-cache" still allows caching — it
        # just forces revalidation against the ETag, so unchanged files come back
        # 304 and cost nothing.
        add_header Cache-Control "no-cache";
    }
}
