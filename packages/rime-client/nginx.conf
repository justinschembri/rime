server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # rime-client is a static SensorThings client. It does not proxy to, or know
    # about, any particular STA server — the browser talks to whatever endpoint
    # the page is configured with. See js/runtime-config.js and README.md.
    location / {
        # 404 on unknown paths rather than falling back to index.html. The app
        # has no client-side routing, it navigates with query params (?sta=),
        # which never reach try_files, so an SPA fallback would only serve the
        # page with a 200 for URLs that do not exist. That masks real mistakes:
        # a stale STA link such as /FROST-Server/v1.1 would return HTML with a
        # success status and fail later inside a JSON parser instead of here.
        try_files $uri $uri/ =404;

        # The app ships unversioned filenames (app.js, js/*.js, styles.css), so
        # without this a browser keeps serving a cached copy after a redeploy and
        # the user silently runs old code. "no-cache" still allows caching — it
        # just forces revalidation against the ETag, so unchanged files come back
        # 304 and cost nothing.
        add_header Cache-Control "no-cache";
    }
}
