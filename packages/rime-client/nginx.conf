server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy FROST API to the internal frost container.
    # state.js derives frostBase from window.location.origin, so the browser
    # will request /FROST-Server/... from this nginx — which forwards it here.
    location /FROST-Server/ {
        proxy_pass         http://frost:8080/FROST-Server/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Serve static files; fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
